plugins {
    id 'org.springframework.boot' version '3.1.5'
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    // Am adaugat :3.1.5 la final aici:
    implementation 'org.springframework.boot:spring-boot-starter-web:3.1.5'
}